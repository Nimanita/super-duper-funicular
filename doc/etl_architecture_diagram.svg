<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1792" width="1200" height="1792" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474F"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
</defs>
<rect width="1200" height="1792" fill="#FFFFFF"/>
<text x="600.0" y="48" text-anchor="middle" font-size="36" font-weight="700" fill="#1F2933">ETL pipeline architecture</text>
<text x="600.0" y="82" text-anchor="middle" font-size="22" fill="#52606D">MongoDB to Postgres, batch, medallion layers on Delta</text>
<rect x="40" y="110" width="1120" height="130" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<path d="M58,110 H310 V240 H58 a18,18 0 0 1 -18,-18 V128 a18,18 0 0 1 18,-18 z" fill="#2E7D32"/>
<text x="175.0" y="171.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">MongoDB</text>
<text x="175.0" y="203.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Source</text>
<text x="340" y="166.0" font-size="23" fill="#1F2933">Collections: users, orders, bills</text>
<text x="340" y="200.0" font-size="23" fill="#1F2933">Plus a supplier product source (still to be confirmed)</text>
<line x1="175.0" y1="244" x2="175.0" y2="320" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="290.0" font-size="22" font-style="italic" fill="#37474F">Scheduled export: only documents with _meta.at after the last run</text>
<rect x="40" y="324" width="1120" height="146" rx="18" fill="#E0F2F1" stroke="#00796B" stroke-width="3"/>
<path d="M58,324 H310 V470 H58 a18,18 0 0 1 -18,-18 V342 a18,18 0 0 1 18,-18 z" fill="#00796B"/>
<text x="175.0" y="393.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">Landing zone</text>
<text x="175.0" y="425.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Cloud object storage</text>
<text x="340" y="371.0" font-size="23" fill="#1F2933">JSON files in MongoDB extended JSON</text>
<text x="340" y="405.0" font-size="23" fill="#1F2933">One folder per collection, then one per run date</text>
<text x="340" y="439.0" font-size="23" fill="#1F2933">Written once, never edited</text>
<line x1="175.0" y1="474" x2="175.0" y2="550" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="520.0" font-size="22" font-style="italic" fill="#37474F">Auto Loader, available-now trigger (batch)</text>
<rect x="40" y="554" width="1120" height="180" rx="18" fill="#FDEBD9" stroke="#B8621B" stroke-width="3"/>
<path d="M58,554 H310 V734 H58 a18,18 0 0 1 -18,-18 V572 a18,18 0 0 1 18,-18 z" fill="#B8621B"/>
<text x="175.0" y="640.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">BRONZE</text>
<text x="175.0" y="672.0" text-anchor="middle" font-size="21" fill="#FFFFFF">4 Delta tables</text>
<text x="340" y="601.0" font-size="23" fill="#1F2933">Exact copy of every document version, append only</text>
<text x="340" y="635.0" font-size="23" fill="#1F2933">Adds bronze_ingested_at, bronze_batch_id,</text>
<text x="340" y="669.0" font-size="23" fill="#1F2933">bronze_source_file, bronze_rescued_data</text>
<text x="340" y="703.0" font-size="23" fill="#1F2933">Holds PII and password: pipeline identity only</text>
<line x1="175.0" y1="738" x2="175.0" y2="814" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="784.0" font-size="22" font-style="italic" fill="#37474F">11 build steps: latest version, flatten, convert, clean</text>
<rect x="40" y="818" width="1120" height="180" rx="18" fill="#ECEFF1" stroke="#455A64" stroke-width="3"/>
<path d="M58,818 H310 V998 H58 a18,18 0 0 1 -18,-18 V836 a18,18 0 0 1 18,-18 z" fill="#455A64"/>
<text x="175.0" y="904.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">SILVER</text>
<text x="175.0" y="936.0" text-anchor="middle" font-size="21" fill="#FFFFFF">8 Delta tables</text>
<text x="340" y="865.0" font-size="23" fill="#1F2933">Latest version per document, typed and de-duplicated</text>
<text x="340" y="899.0" font-size="23" fill="#1F2933">Derived rules: is_test, supplier_order_id, po_status, channel</text>
<text x="340" y="933.0" font-size="23" fill="#1F2933">PII tagged per column, password never enters silver</text>
<text x="340" y="967.0" font-size="23" fill="#1F2933">Domains: users and catalog, orders, bills</text>
<line x1="175.0" y1="1002" x2="175.0" y2="1094" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="1056.0" font-size="22" font-style="italic" fill="#37474F">Select columns, drop PII, remove test users</text>
<line x1="995.0" y1="1001" x2="995.0" y2="1008" stroke="#C62828" stroke-width="3" stroke-dasharray="5 4"/>
<rect x="830" y="1008" width="330" height="40" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="995.0" y="1035" text-anchor="middle" font-size="21" fill="#8E1B1B">silver_rejects: failed documents</text>
<rect x="40" y="1098" width="1120" height="180" rx="18" fill="#FFF8E1" stroke="#9A6F00" stroke-width="3"/>
<path d="M58,1098 H310 V1278 H58 a18,18 0 0 1 -18,-18 V1116 a18,18 0 0 1 18,-18 z" fill="#9A6F00"/>
<text x="175.0" y="1184.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">GOLD</text>
<text x="175.0" y="1216.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Business model</text>
<text x="340" y="1145.0" font-size="23" fill="#1F2933">Star (published): 7 tables = 2 dimensions + 5 facts</text>
<text x="340" y="1179.0" font-size="23" fill="#1F2933">Snowflake (alternative): 9 tables = 4 dimensions + 5 facts</text>
<text x="340" y="1213.0" font-size="23" fill="#1F2933">Silver column names, natural keys, no PII</text>
<text x="340" y="1247.0" font-size="23" fill="#1F2933">Answers the 10 business questions</text>
<line x1="175.0" y1="1282" x2="175.0" y2="1358" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="1328.0" font-size="22" font-style="italic" fill="#37474F">Full snapshot, staging schema swapped in as one step</text>
<rect x="40" y="1362" width="1120" height="146" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
<path d="M58,1362 H310 V1508 H58 a18,18 0 0 1 -18,-18 V1380 a18,18 0 0 1 18,-18 z" fill="#1565C0"/>
<text x="175.0" y="1431.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">POSTGRES</text>
<text x="175.0" y="1463.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Serving database</text>
<text x="340" y="1409.0" font-size="23" fill="#1F2933">Read-only copy of gold, same table and column names</text>
<text x="340" y="1443.0" font-size="23" fill="#1F2933">Primary keys enforced, foreign keys not created</text>
<text x="340" y="1477.0" font-size="23" fill="#1F2933">One way: Delta to Postgres</text>
<line x1="175.0" y1="1512" x2="175.0" y2="1588" stroke="#37474F" stroke-width="4" marker-end="url(#arr)"/>
<text x="201.0" y="1558.0" font-size="22" font-style="italic" fill="#37474F">Read-only role</text>
<rect x="40" y="1592" width="1120" height="130" rx="18" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/>
<path d="M58,1592 H310 V1722 H58 a18,18 0 0 1 -18,-18 V1610 a18,18 0 0 1 18,-18 z" fill="#6A1B9A"/>
<text x="175.0" y="1653.0" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">BI and analysts</text>
<text x="175.0" y="1685.0" text-anchor="middle" font-size="21" fill="#FFFFFF">Consumers</text>
<text x="340" y="1665.0" font-size="23" fill="#1F2933">Dashboards and ordinary SQL on the star model</text>
<text x="600.0" y="1760" text-anchor="middle" font-size="21" fill="#52606D">Each layer can be rebuilt from the one before it. Bronze replays from the landing files.</text>
</svg>